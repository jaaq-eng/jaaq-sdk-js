name: pnpm checks (reusable)

on:
  workflow_call:
    inputs:
      audit-level:
        description: 'Severity threshold for `pnpm audit` (low | moderate | high | critical).'
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: 'pnpm checks (audit: ${{ inputs.audit-level }})'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          set -ux
          pnpm install --frozen-lockfile

      - name: Run pnpm audit
        id: audit
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: |
          set -ux
          set +e
          pnpm audit --audit-level="${AUDIT_LEVEL}" --json > pnpm-audit.json
          echo "exit_code=$?" >> "${GITHUB_OUTPUT}"
          set -e

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pnpm-audit-report
          path: pnpm-audit.json
          if-no-files-found: error

      - name: Verify exact-version pinning
        if: always()
        run: |
          set -ux
          pnpm run check:pins

      - name: Fail with audit remediation guidance
        if: always() && steps.audit.outputs.exit_code != '0'
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: |
          set -ux
          echo "::error::pnpm audit found vulnerabilities at or above level '${AUDIT_LEVEL}'"
          echo "Download the 'pnpm-audit-report' artifact from this run, inspect pnpm-audit.json,"
          echo "and add an overrides entry to pnpm-workspace.yaml, or run /fix-pnpm-audit locally."
          exit 1
