name: Dependabot merge

# jaaq-common's shared merge: patch and minor Dependabot PRs auto-merge, majors wait for a person.

on:
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  merge:
    uses: jaaq-eng/jaaq-common/.github/workflows/wc-dependabot-merge.yml@main
