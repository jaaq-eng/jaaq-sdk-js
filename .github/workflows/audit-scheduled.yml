name: pnpm audit (scheduled)

# jaaq-common's shared audit: a red audit raises the fix PR from the `audit-autofix` environment and tells Slack.

on:
  schedule:
    - cron: '0 0,6,12,18 * * *' # 00:00 / 06:00 / 12:00 / 18:00 UTC
  workflow_dispatch:
    inputs:
      force-fix:
        description: Raise the fix PR even on a green audit, to exercise the credentials it needs
        type: boolean
        default: false
      report-to-slack:
        description: Post the verdict to Slack even when the audit passes
        type: boolean
        default: false

# A called workflow holds no permission its caller did not grant; the App token is minted by OIDC.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  audit:
    uses: jaaq-eng/jaaq-common/.github/workflows/wc-pnpm-audit-scheduled.yml@main
    with:
      audit-level: moderate
      # A boolean input is empty on a schedule run.
      force-fix: ${{ inputs.force-fix || false }}
      report-to-slack: ${{ inputs.report-to-slack || false }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AUDIT_AUTOFIX_PAT: ${{ secrets.AUDIT_AUTOFIX_PAT }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
