name: pnpm audit (scheduled)

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      report-to-slack:
        description: Post the verdict to Slack even when the audit passes
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    uses: ./.github/workflows/pnpm-checks.yml
    with:
      audit-level: moderate

  report:
    needs: checks
    if: always() && (needs.checks.result == 'failure' || inputs.report-to-slack)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Post verdict to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SECURITY_ALERTS_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ github.repository }} pnpm audit (moderate): ${{ needs.checks.result == 'success' && 'passed' || 'failed' }} – ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
