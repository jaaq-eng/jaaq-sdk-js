# pnpm-workspace.yaml — pnpm 11+ settings live here, not in package.json's `pnpm` field.
# This repo is not a multi-package/monorepo workspace; this file exists solely to hold the settings below.
#
# `engineStrict: true` makes pnpm hard-fail the install when the active Node.js
# version does not match the root `engines.node` field in package.json. Without it,
# pnpm only logs `[WARN] Unsupported engine` and proceeds — which defeats the point
# of declaring engines. (The kebab-case `engine-strict` in `.npmrc` is ignored by
# pnpm 11; this camelCase key in pnpm-workspace.yaml is the canonical home.)
engineStrict: true

# `packageManagerStrictVersion: true` makes pnpm refuse to operate if a pnpm
# version different from the one pinned in `packageManager` (currently 11.1.3) is
# in use. We can't use `engines.pnpm` for this on a published library — that field
# ships in the npm publish and would force every downstream consumer onto exactly
# our pnpm version. This setting lives only in pnpm-workspace.yaml, which is
# repo-local, so consumers are unaffected.
packageManagerStrictVersion: true

# `allowBuilds` is a security gate. Since pnpm 9, dependency install/postinstall
# scripts are blocked by default — a supply-chain hardening so a malicious package
# cannot run arbitrary code during `pnpm install`. Each entry below explicitly
# authorises that package's scripts to run.
#
# Why these are allowlisted:
#   - esbuild: native bundler binary used by vitest (for test transforms); install
#              script links the platform-specific binary, vitest breaks without it.
#   - msw:     Mock Service Worker; postinstall prints a CLI message, harmless
#              but blocked by the default policy.
allowBuilds:
  esbuild: true
  msw: true

# `overrides` was previously declared as `pnpm.overrides` in root package.json
# (pnpm 11 no longer reads the `pnpm` field). The entries below are security
# mitigations for transitive-only vulnerabilities surfaced by `pnpm audit`.
# Every vulnerable module below reaches us only via dev/test tooling (vitest,
# eslint, openapi-typescript); none is a direct dependency.
#
#   - brace-expansion: two copies reach us, each version-scoped to stay within its
#              own major (a bare override would drag the 2.x copy onto 5.x, whose
#              CommonJS build exports a namespace object rather than a callable —
#              minimatch@5 does `require('brace-expansion')(…)` and would throw).
#              Both entries cover GHSA-mh99-v99m-4gvg (unbounded-expansion DoS) and
#              GHSA-rgw5-rvv9-x895 (unbounded intermediate arrays, which bypasses
#              the mh99 mitigation). Both use a caret range deliberately, so later
#              5.x / 2.x security releases flow through without editing this file;
#              "in range" below means within the parent's declared range, and the
#              version-scoped key is what keeps each copy inside its own major.
#                * `@^5.0.0` → `^5.0.9`: reaches us as minimatch@10's dependency via
#                  the eslint / typescript-eslint chain; minimatch@10 declares
#                  `^5.0.5`, so 5.0.9 is in range for it.
#                * `@^2.0.0` → `^2.1.4`: reaches us via openapi-typescript >
#                  @redocly/openapi-core@1.x > minimatch@5.1.9, which declares
#                  `^2.0.1`, so this too is in-range. brace-expansion 2.1.4 is the
#                  2.x backport of both advisories (mh99 landed in 2.1.3, rgw5 in
#                  2.1.4); it keeps the callable `module.exports = expandTop` shape
#                  minimatch@5 needs and adds no `engines` floor. This backport is
#                  what made the previous `auditConfig.ignoreGhsas` suppression of
#                  GHSA-mh99-v99m-4gvg unnecessary — it has been removed.
#   - esbuild: forced to the patched 0.28 line (GHSA-g7r4-m6w7-qqqr, dev-server
#              arbitrary file read on Windows). Safe because the vite override
#              below resolves vite to 7.3.6, whose esbuild range is
#              `^0.27.0 || ^0.28.0` and therefore consumes 0.28.1.
#   - fast-uri: forced past the host confusion via a backslash authority introducer
#              (GHSA-7p8r-x3mc-p8w7). The single copy reaches us via
#              @commitlint/cli > @commitlint/config-validator > ajv, which declares
#              `^3.0.1`, so 3.1.5 is in range. Supersedes the earlier
#              `fast-uri@<=3.1.3: '3.1.4'` entry: that pinned an exact 3.1.4, which
#              this advisory then marked vulnerable, and its `<=3.1.3` comparator no
#              longer matched the version it had itself installed — so the entry had
#              become inert. A caret on the 3.x line replaces it, deliberately not
#              crossing to 4.x (fast-uri 4.1.2 is also patched, but ajv cannot take
#              a major bump).
#   - js-yaml: forced past the quadratic-complexity merge-key DoS
#              (GHSA-h67p-54hq-rp68); the vulnerable 4.1.1 copy reaches us via
#              @redocly/openapi-core, which itself declares `^4.2.0`.
#   - postcss: forced past the arbitrary `.map` file read via an attacker-controlled
#              `sourceMappingURL` when `from` is unset (GHSA-fxqj-rqcc-2cmp, the
#              incomplete-fix follow-up to GHSA-6g55-p6wh-862q). Applied bare because
#              every copy arrives via vite (vitest / @vitest/mocker) and vite@7.3.6
#              declares `^8.5.6`, so 8.5.23 is in range for all of them. Caret again,
#              so later 8.x security releases flow through (currently resolves 8.5.25).
#   - vite:    forced to the patched 7.3.5+ line, covering both the `server.fs.deny`
#              bypass (GHSA-fx2h-pf6j-xcff, high) and the launch-editor NTLM hash
#              disclosure (GHSA-v6wh-96g9-6wx3). Supersedes the earlier
#              `vite@<=7.3.1: '7.3.2'` entry, which 7.3.2 itself later fell foul of.
overrides:
  esbuild: '^0.28.1' # GHSA-g7r4-m6w7-qqqr — 2026-07-14
  fast-uri: '^3.1.5' # GHSA-7p8r-x3mc-p8w7 — 2026-08-03
  js-yaml: '^4.1.2' # GHSA-h67p-54hq-rp68 — 2026-07-14
  postcss: '^8.5.23' # GHSA-fxqj-rqcc-2cmp — 2026-08-03
  vite: '^7.3.5' # GHSA-fx2h-pf6j-xcff + GHSA-v6wh-96g9-6wx3 — 2026-07-14
  brace-expansion@^2.0.0: '^2.1.4' # GHSA-mh99-v99m-4gvg + GHSA-rgw5-rvv9-x895 — 2026-08-03
  brace-expansion@^5.0.0: '^5.0.9' # GHSA-mh99-v99m-4gvg + GHSA-rgw5-rvv9-x895 — 2026-08-03


# No `auditConfig.ignoreGhsas` block: every advisory currently reported by
# `pnpm audit` is actioned by an override above. The previous suppression of
# GHSA-mh99-v99m-4gvg (brace-expansion) was removed on 2026-08-03 — it existed only
# because the advisory had no 2.x backport at the time, and 2.1.3/2.1.4 now provide
# one, so the 2.x copy under minimatch@5 can be forced forward in-range instead.
